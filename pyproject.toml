[project]
name = "personal-knowledge-agent"
version = "0.1.0"
description = "Self-hosted personal knowledge OS: your knowledge belongs to you, LLMs are interchangeable providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",  # asyncio extra provides greenlet, required by async engine
    "aiosqlite",
    "alembic",
    "pydantic-settings",
    "qdrant-client",
    "httpx",
    "openai",
    "python-multipart",
    "pypdf",  # PDF text extraction (Phase 3)
    "trafilatura",  # research page text extraction (Phase 6; the only new dependency)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

# Mirror of the `dev` extra above: a bare `uv sync` installs the default
# `dev` dependency group, but never optional-dependencies extras (uv 0.11
# has no default-extras setting). This keeps `uv sync` + `uv run pytest`
# working out of the box.
[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]